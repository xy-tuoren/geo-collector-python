[project]
name = "xiaohe-geo-collector"
version = "0.1.8"
description = "Python Android capture CLI with verified reusable Agent repairs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["android", "adb", "uiautomator2", "ocr", "cli", "agent", "self-healing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Tool installations resolve these independently of uv.lock.
dependencies = [
    "uiautomator2==3.7.0",
    "adbutils==2.12.0",
    "pillow==12.3.0",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.3; python_version >= '3.12'",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "opencv-python==4.14.0.94",
]

[project.urls]
Homepage = "https://github.com/xy-tuoren/geo-collector-python"
Repository = "https://github.com/xy-tuoren/geo-collector-python"
Issues = "https://github.com/xy-tuoren/geo-collector-python/issues"
Changelog = "https://github.com/xy-tuoren/geo-collector-python/releases"

[project.scripts]
geo-collect = "geo_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_collector"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills/geo-collector/SKILL.md" = "geo_collector/agent_guide.md"
".agents/skills/geo-collector/references/install.md" = "geo_collector/skill_references/install.md"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/INSTALL.md", "/.agents/skills/geo-collector"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
