name: CI

on:
  push:
    branches: [main, master, codex/python-redesign]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Syntax, whitespace, and test suite
        run: |
          uv run python -m compileall -q src
          git diff --check
          uv run pytest -q

      - name: Verify wheel and release ZIP build
        run: |
          uv build --no-sources --out-dir dist
          uv run python scripts/build_release.py
          ls -lh dist
